server.port=8082
logging.level.com.omnistack.backend=WARN
app.integrations.mock-enabled=false

# Oracle TUKUNAFUNC — catálogo compartido (AD_*) en HPROD (env vars del pod)
app.datasource.prod.url=${APP_DATASOURCE_PROD_URL}
app.datasource.prod.username=${APP_DATASOURCE_PROD_USERNAME}
app.datasource.prod.password=${APP_DATASOURCE_PROD_PASSWORD}

# Oracle GPF_OMNISTACK — transaccional (IN_OMNI_*) en HPROD (env vars del pod)
app.datasource.mom.url=${APP_DATASOURCE_MOM_URL}
app.datasource.mom.username=${APP_DATASOURCE_MOM_USERNAME}
app.datasource.mom.password=${APP_DATASOURCE_MOM_PASSWORD}
app.datasource.mom.schema=${APP_DATASOURCE_MOM_SCHEMA:GPF_OMNISTACK}
